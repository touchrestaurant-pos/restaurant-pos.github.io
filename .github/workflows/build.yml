name: Build apps

# Builds the Android APK and Windows app on GitHub's servers (the web app is in web.yml),
# so nothing has to be installed on your own computer.
# Runs on every push to main, or press "Run workflow" on the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create platform folders
        run: |
          flutter create --platforms=android --project-name restaurant_pos --org com.restaurantpos .
          git checkout -- lib pubspec.yaml
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do cp branding/android/mipmap-$d/ic_launcher.png android/app/src/main/res/mipmap-$d/ic_launcher.png; done
          # Some plugins are built against an older Android version than others need; raise them all to 36.
          cat > /tmp/patch.kts <<'EOF'
          subprojects {
              afterEvaluate {
                  val ext = extensions.findByName("android")
                  if (ext != null) {
                      try {
                          ext.javaClass.getMethod("setCompileSdkVersion", Int::class.javaPrimitiveType).invoke(ext, 36)
                      } catch (e: Exception) {
                          println("Could not raise compileSdk for " + project.name + ": " + e)
                      }
                  }
              }
          }
          EOF
          sed -i 's/^          //' /tmp/patch.kts
          cat /tmp/patch.kts android/build.gradle.kts > /tmp/root.kts && cp /tmp/root.kts android/build.gradle.kts
          rm -rf test
      - run: flutter pub get
      - name: Build APK (retries, because downloads from GitHub and Maven sometimes time out)
        run: |
          for i in 1 2 3; do
            flutter build apk --release && exit 0
            echo "Attempt $i failed, trying again in 30 seconds"
            sleep 30
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: restaurant-pos-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create platform folders
        shell: bash
        run: |
          flutter create --platforms=windows --project-name restaurant_pos --org com.restaurantpos .
          git checkout -- lib pubspec.yaml
          cp branding/windows/app_icon.ico windows/runner/resources/app_icon.ico
          rm -rf test
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: restaurant-pos-windows
          path: build/windows/x64/runner/Release
